  <!-- title with shimmer + glow -->
  <text x="600" y="196" text-anchor="middle" filter="url(#glow)" fill="url(#shimmer)"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1.5">
    Thanks for visiting!
    <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
  </text>
  <!-- tagline fades in after the title -->
  <text x="600" y="232" text-anchor="middle" fill="#C4B5FD" opacity="0"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing="3">
    LET'S BUILD SOMETHING INTELLIGENT TOGETHER
    <animate attributeName="opacity" values="0;0.95" begin="1.2s" dur="1.8s" fill="freeze"/>
