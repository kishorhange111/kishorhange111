  <circle cx="180" cy="203" r="11.0" fill="#A78BFA" opacity="0" filter="url(#soft)"><animate attributeName="opacity" values="0;0.55;0;0" keyTimes="0;0.06;0.3;1" dur="3.2s" begin="0.75s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="203" r="5" fill="#1A1B27" stroke="#A78BFA" stroke-width="1.6"><animate attributeName="fill" values="#1A1B27;#C4B5FD;#1A1B27;#1A1B27" keyTimes="0;0.06;0.3;1" dur="3.2s" begin="0.75s" repeatCount="indefinite"/></circle>
