  <circle cx="180" cy="236" r="5" fill="#1A1B27" stroke="#A78BFA" stroke-width="1.6"><animate attributeName="fill" values="#1A1B27;#C4B5FD;#1A1B27;#1A1B27" keyTimes="0;0.06;0.3;1" dur="3.2s" begin="0.75s" repeatCount="indefinite"/></circle>
  <circle cx="270" cy="170" r="11.0" fill="#A78BFA" opacity="0" filter="url(#soft)"><animate attributeName="opacity" values="0;0.55;0;0" keyTimes="0;0.06;0.3;1" dur="3.2s" begin="1.50s" repeatCount="indefinite"/></circle>
  <circle cx="270" cy="170" r="5" fill="#1A1B27" stroke="#A78BFA" stroke-width="1.6"><animate attributeName="fill" values="#1A1B27;#C4B5FD;#1A1B27;#1A1B27" keyTimes="0;0.06;0.3;1" dur="3.2s" begin="1.50s" repeatCount="indefinite"/></circle>
  <circle cx="270" cy="236" r="11.0" fill="#A78BFA" opacity="0" filter="url(#soft)"><animate attributeName="opacity" values="0;0.55;0;0" keyTimes="0;0.06;0.3;1" dur="3.2s" begin="1.50s" repeatCount="indefinite"/></circle>
  <circle cx="270" cy="236" r="5" fill="#1A1B27" stroke="#A78BFA" stroke-width="1.6"><animate attributeName="fill" values="#1A1B27;#C4B5FD;#1A1B27;#1A1B27" keyTimes="0;0.06;0.3;1" dur="3.2s" begin="1.50s" repeatCount="indefinite"/></circle>
  <g stroke="#6D5BD0" stroke-width="1" opacity="0.45">
    <line x1="1110" y1="170" x2="1020" y2="170"/>
    <line x1="1110" y1="170" x2="1020" y2="203"/>
    <line x1="1110" y1="170" x2="1020" y2="236"/>
    <line x1="1110" y1="236" x2="1020" y2="170"/>
    <line x1="1110" y1="236" x2="1020" y2="203"/>
    <line x1="1110" y1="236" x2="1020" y2="236"/>
    <line x1="1020" y1="170" x2="930" y2="170"/>
    <line x1="1020" y1="170" x2="930" y2="236"/>
    <line x1="1020" y1="203" x2="930" y2="170"/>
    <line x1="1020" y1="203" x2="930" y2="236"/>
    <line x1="1020" y1="236" x2="930" y2="170"/>
    <line x1="1020" y1="236" x2="930" y2="236"/>
  </g>
  <g fill="#E9E5FF" filter="url(#soft)">
    <circle r="2.2" opacity="0"><animateMotion path="M1110,170 L1020,170" dur="3.2s" begin="0.00s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.234;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.214;0.234;1" dur="3.2s" begin="0.00s" repeatCount="indefinite"/></circle>
    <circle r="2.2" opacity="0"><animateMotion path="M1110,170 L1020,236" dur="3.2s" begin="0.00s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.234;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.214;0.234;1" dur="3.2s" begin="0.00s" repeatCount="indefinite"/></circle>
    <circle r="2.2" opacity="0"><animateMotion path="M1110,236 L1020,203" dur="3.2s" begin="0.00s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.234;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.214;0.234;1" dur="3.2s" begin="0.00s" repeatCount="indefinite"/></circle>
    <circle r="2.2" opacity="0"><animateMotion path="M1020,170 L930,236" dur="3.2s" begin="0.75s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.234;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.214;0.234;1" dur="3.2s" begin="0.75s" repeatCount="indefinite"/></circle>
    <circle r="2.2" opacity="0"><animateMotion path="M1020,203 L930,170" dur="3.2s" begin="0.75s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.234;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.214;0.234;1" dur="3.2s" begin="0.75s" repeatCount="indefinite"/></circle>
    <circle r="2.2" opacity="0"><animateMotion path="M1020,236 L930,236" dur="3.2s" begin="0.75s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.234;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.214;0.234;1" dur="3.2s" begin="0.75s" repeatCount="indefinite"/></circle>
  </g>
