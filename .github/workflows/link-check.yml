name: Check Markdown Links

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Markdown links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --exclude "^mailto:"
            --exclude "linkedin\.com"
            --exclude "github-profile-summary-cards\.vercel\.app"
            --exclude "skillicons\.dev"
            --exclude "img\.shields\.io"
            README.md PORTFOLIO_MAP.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
